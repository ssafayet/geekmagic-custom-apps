name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Assemble release bundle
        run: |
          mkdir -p release/geekmagic-custom-apps
          cp -r apps/server/dist release/geekmagic-custom-apps/server
          cp -r apps/web/dist release/geekmagic-custom-apps/web
          cp -r tools/claude-statusline-bridge/dist release/geekmagic-custom-apps/bridge
          cp -r packages/renderer/assets release/geekmagic-custom-apps/assets
          cp README.md LICENSE .env.example release/geekmagic-custom-apps/
          cp -r docs release/geekmagic-custom-apps/docs
          tar -czf geekmagic-custom-apps.tar.gz -C release geekmagic-custom-apps

      - name: Generate SBOM
        run: |
          pnpm licenses list --prod --json > sbom-licenses.json || true
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json || true

      - name: Checksums
        run: sha256sum geekmagic-custom-apps.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            geekmagic-custom-apps.tar.gz
            checksums.txt
            sbom.json
            sbom-licenses.json
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

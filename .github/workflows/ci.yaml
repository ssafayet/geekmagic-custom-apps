name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Current and previous active LTS lines.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # The Docker bridge runs under whatever /bin/sh the host has; dash here.
      - name: Lint the shell bridge
        run: shellcheck -s sh -S warning tools/claude-bridge.sh

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Rendering is deterministic, so a failure is a real visual regression.
      # Keep the artifacts so it can be inspected.
      - name: Upload render artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-artifacts-node${{ matrix.node }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: geekmagic-custom-apps:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the bundled fonts render without system fontconfig, that the UI is
      # served from the flattened deploy layout, and that the host-side shell bridge
      # reaches the container through Docker's NAT as compose.yaml configures it.
      - name: Smoke test the image
        env:
          GCA_BRIDGE_TOKEN: ci-bridge-token-0123456789
        run: |
          docker run -d --name gca -p 127.0.0.1:3210:3210 \
            -e GCA_BRIDGE_TOKEN -e GCA_BRIDGE_ALLOW_PRIVATE_SOURCES=true \
            geekmagic-custom-apps:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3210/api/v1/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3210/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3210/)" = "200"
          echo '{"rate_limits":{"five_hour":{"used_percentage":12,"resets_at":"2099-01-01T00:00:00Z"}}}' \
            | sh tools/claude-bridge.sh statusline
          curl -sf -H "Authorization: Bearer $GCA_BRIDGE_TOKEN" \
            http://127.0.0.1:3210/internal/claude/status | tee /dev/stderr | grep -q '"lastReceivedAt":"'

      - name: Container logs
        if: always()
        run: docker logs gca || true

name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove anything personal before posting: home coordinates, public IPs,
        hostnames, tokens. The Diagnostics page report already excludes them.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Native (pnpm start, launchd or systemd)
        - Docker (compose.yaml)
        - Docker (host-network override)
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Display model and firmware
      placeholder: SmallTV-PRO, V3.4.88EN
  - type: input
    id: versions
    attributes:
      label: OS and Node.js version
      placeholder: macOS 15, Node 22.11
  - type: textarea
    id: logs
    attributes:
      label: Server log or Diagnostics report
      description: The relevant lines, with anything personal removed.
      render: text

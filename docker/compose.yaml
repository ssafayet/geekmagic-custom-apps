services:
  geekmagic-custom-apps:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: geekmagic-custom-apps:1.0.0
    restart: unless-stopped

    # Host networking is the simplest way to reach displays on your LAN and to
    # accept the Claude status-line bridge on loopback. On Docker Desktop (macOS
    # and Windows) host networking behaves differently: use the ports mapping
    # below instead and make sure the display subnet is routable.
    network_mode: host

    environment:
      # Loopback with host networking: reachable at 127.0.0.1:3210 from this machine
      # and nowhere else, which is also what keeps the UI out of the login wall.
      # Binding 0.0.0.0 here requires an administrator password.
      GCA_HOST: 127.0.0.1
      GCA_PORT: 3210
      GCA_DATA_DIR: /data
      GCA_LOG_LEVEL: info
      # Lets the host-side status-line bridge authenticate against a server whose
      # token file lives in a volume it cannot read. See docs/CLAUDE-BRIDGE.md.
      GCA_BRIDGE_TOKEN: ${GCA_BRIDGE_TOKEN:-}
      # Required only when using the published-port mapping below instead of host
      # networking.
      GCA_BRIDGE_ALLOW_PRIVATE_SOURCES: ${GCA_BRIDGE_ALLOW_PRIVATE_SOURCES:-false}
      # Mount your own key to keep secrets readable across container rebuilds.
      # GCA_MASTER_KEY_FILE: /run/secrets/gca_master_key

    volumes:
      - gca-data:/data
      # - ./master.key:/run/secrets/gca_master_key:ro

    # Uncomment together with removing `network_mode: host`, and set alongside it:
    #   GCA_HOST: 0.0.0.0                       (a published port cannot reach the
    #                                            container's own loopback)
    #   GCA_AUTH_REQUIRED: "false"              (0.0.0.0 inside a container is not
    #                                            exposure; the binding below is what
    #                                            limits who can connect)
    #   GCA_BRIDGE_ALLOW_PRIVATE_SOURCES: "true" (NAT rewrites the bridge's source)
    # ports:
    #   - "127.0.0.1:3210:3210"

volumes:
  gca-data:
